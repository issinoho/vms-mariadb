# Upstream MariaDB release this port is built from.
# 11.4 is the newest LTS branch that still builds as C++11 (11.8 and later need
# C++17); see docs/DECISIONS.md D2 (approved 2026-10-04).
UPSTREAM_NAME=mariadb
UPSTREAM_VERSION=11.4.13
UPSTREAM_URL=https://archive.mariadb.org/mariadb-11.4.13/source/mariadb-11.4.13.tar.gz
UPSTREAM_SHA256=1bb254b106d0a7ca871cfa18fa6e18d4b80a7430f9ec9d1571ec4271a13def96
# MariaDB Signing Key <signing-key@mariadb.org>
# (https://supplychain.mariadb.com/MariaDB-Server-GPG-KEY).
# Public key: keys/mariadb-signing-key.asc
UPSTREAM_GPG_KEY=177F4010FE56CA3336300305F1656F24C74CD1D8
# Our patch level on top of the upstream release (11.4.13-vms1)
VMS_PATCH_LEVEL=1
# Dependencies built by the sibling repos on each node, in the same work
# directory: <workdir>.<TREE>.INSTALL_<arch>] (INCLUDE, LIB).
ZLIB_VERSION=1.3.2
ZLIB_TREE=ZLIB-1_3_2
PCRE2_VERSION=10.49
PCRE2_TREE=PCRE2-10_49
# TLS: VSI's SSL3 kit (OpenSSL 3.0); its shared images are a prerequisite.
SSL_KIT=SSL3
